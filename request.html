{% extends 'base.html' %}{% block title %}Request Food | FoodRescue AI{% endblock %}{% block content %}<section class="form-shell"><p class="eyebrow">FOOD REQUEST</p><h1>Request {{ donation['food_name'] }}</h1><p class="lead">Available: {{ donation['quantity'] }} {{ donation['unit'] }} · {{ donation['location'] }}</p><form class="form-grid" method="post" action="{{ url_for('submit_request', donation_id=donation_id) }}"><label>Recipient name<input name="recipient_name" required></label><label>Organisation name<input name="organization"></label><label>Contact number<input name="contact" required pattern="[0-9]{10}" title="Enter a 10-digit number"></label><label>Required quantity<input type="number" name="requested_quantity" min="1" max="{{ donation['quantity'] }}" required></label><label class="full">Purpose<textarea name="purpose" rows="3"></textarea></label><button class="btn full">Submit Food Request</button></form></section>{% endblock %}
