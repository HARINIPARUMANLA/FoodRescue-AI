{% extends 'base.html' %}{% block title %}Donate Food | FoodRescue AI{% endblock %}
{% block content %}<section class="form-shell"><p class="eyebrow">SHARE WHAT YOU CAN</p><h1>Donate Food</h1><p class="lead">Add the details of safe surplus food available for collection.</p>
<form class="form-grid" action="{{ url_for('submit_donation') }}" method="post">
<label>Donor name<input name="donor_name" required></label><label>Food name<input name="food_name" required></label>
<label>Category<select name="category" required><option value="">Choose category</option><option>Cooked Food</option><option>Fruits</option><option>Vegetables</option><option>Bakery Items</option><option>Packaged Food</option></select></label>
<label>Quantity<input type="number" name="quantity" min="1" required></label><label>Unit<select name="unit" required><option>plates</option><option>kg</option><option>packets</option><option>boxes</option><option>items</option></select></label>
<label>Prepared at<input type="datetime-local" name="prepared_at" required></label><label>Collection deadline<input type="datetime-local" name="deadline" required></label>
<label>Storage details<input name="storage" placeholder="e.g. Refrigerated" required></label><label>Location<input name="location" required></label><label>Contact number<input name="contact" required pattern="[0-9]{10}" title="Enter a 10-digit number"></label>
<label class="full">Description<textarea name="description" rows="3"></textarea></label><button class="btn full" type="submit">Submit Donation</button></form></section>{% endblock %}
