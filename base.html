<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FoodRescue AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url_for('home') }}">FoodRescue <span>AI</span></a>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('donate') }}">Donate Food</a>
    <a href="{{ url_for('listings') }}">Find Food</a>
    <a href="{{ url_for('smart_matching') }}">Smart Matching</a>
    <a href="{{ url_for('view_requests') }}">Manage Requests</a>
    <a href="{{ url_for('chatbot') }}">RescueBot</a>
  </nav>
</header>
<main class="page-wrap">{% block content %}{% endblock %}</main>
<footer><strong>FoodRescue AI</strong> · Save Food. Share Hope.</footer>
</body>
</html>
